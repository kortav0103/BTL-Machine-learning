[project]
name = "btl-machine-learning"
version = "0.1.0"
description = "CelebA facial-attribute classification with pretrained CNN features"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "matplotlib>=3.8",
  "pillow>=10.0",
  "tqdm>=4.66",
  "torch>=2.3",
  "torchvision>=0.18",
  "huggingface-hub>=0.24",
  "pyarrow>=16.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
